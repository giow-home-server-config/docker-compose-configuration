services:
  kavita:
    image: jvmilazz0/kavita:latest    # Using the stable branch from the offical dockerhub repo.
    container_name: kavita
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.118
    volumes:
      - ${USERDIR}/docker/kavita:/kavita/config
      # Disks
      - /mnt/:/disks/other/
      - ${USERDIR}/Downloads:/disks/hdd-sata-0/Downloads
      - ${USERDIR}/Media:/disks/hdd-sata-0/Media
    environment:
      - TZ=${TZ}
    ports:
      - "9014:5000"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.books-rtr.entrypoints=https"
      - "traefik.http.routers.books-rtr.rule=HostHeader(`books.$DOMAINNAME`)"
      - "traefik.http.routers.books-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.books-rtr.middlewares=chain-oauth@file"
      ## HTTP Services
      - "traefik.http.routers.books-rtr.service=books-svc"
      - "traefik.http.services.books-svc.loadbalancer.server.port=5000"
