name: Traefik
version: "2.0.0"
slug: traefik
description: Reverse proxy com TLS automatico (Let's Encrypt via DNS-01 Cloudflare)
arch:
  - amd64
init: false
startup: services
boot: auto
# Rede do host para o frpc (tambem host_network) alcancar 127.0.0.1:<listen_port>
# sem depender de DNS interno do supervisor.
host_network: true
map:
  # /config: acme.json (certificados).
  - type: app_config
    read_only: false
  # /share e onde fica o access log, para o add-on do crowdsec conseguir ler.
  - type: share
    read_only: false
  # As regras (routers, services, middlewares) vem do repositorio clonado em
  # /addons/homelab. Somente leitura: quem muda regra e o git, nao o traefik.
  - type: addons
    read_only: true
options:
  acme_email: giofmartinelli@gmail.com
  cf_dns_api_token: ""
  log_level: INFO
  # Porta alta: o traefik roda sem root e nao pode abrir porta < 1024. O frpc
  # entrega aqui (opcao local_port dele).
  listen_port: 8443
  # O frpc entrega em 127.0.0.1, entao e ELE que precisa ser confiavel para o
  # traefik preservar o X-Forwarded-For que a cloudflare mandou. Sem isso o
  # traefik descarta o header e todo mundo vira 127.0.0.1 la no HA.
  trusted_forward_ips: 127.0.0.1/32
  access_log: /share/traefik/access.log
  access_log_max_bytes: 104857600
  rules_dir: /addons/homelab/mini-pc-bd/traefik/rules
  # Segredos usados pelas regras via {{ env "NOME" }} (API keys, chave do
  # crowdsec). Ficam so aqui, nunca no repositorio.
  secrets: []
schema:
  acme_email: email
  cf_dns_api_token: password
  log_level: list(DEBUG|INFO|WARN|ERROR)
  listen_port: port
  trusted_forward_ips: str
  access_log: str
  access_log_max_bytes: int
  rules_dir: str
  secrets:
    - name: match(^[A-Z][A-Z0-9_]*$)
      value: password
  # So para teste: aponta o ACME para outro CA (ex.: staging do Let's Encrypt).
  acme_ca_server: url?
