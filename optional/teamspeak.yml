version: "3.7"

services:
  teamspeak:
    restart: unless-stopped
    image: mbentley/teamspeak
    environment:
      - TS3SERVER_LICENSE=accept
    volumes:
      - ${USERDIR}/docker/teamspeak:/data:rw
    ports:
      - '9987:9987/udp'
      - '30033:30033'
      - '10011:10011'
      - '41144:41144'
