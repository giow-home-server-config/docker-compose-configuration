   restart: unless-stopped
   networks:
     t2_proxy:
       ipv4_address: 192.168.90.96
   security_opt:
     - no-new-privileges:true
   volumes:
     - ${USERDIR}/docker/overseerr:/config
     - ${USERDIR}/docker/overseerr/logo-branca.svg:/app/overseerr/public/logo_stacked.svg
     - ${USERDIR}/docker/overseerr/logo-branca.svg:/app/overseerr/public/logo_full.svg
     - ${USERDIR}/docker/overseerr/logo-branca.png:/app/overseerr/public/logo_full.png
   environment:
     - PUID=$PUID
     - PGID=$PGID
     - TZ=$TZ
   labels:
     - "traefik.enable=true"
     ## HTTP Routers
     - "traefik.http.routers.overseerr-rtr.entrypoints=https"
     - "traefik.http.routers.overseerr-rtr.rule=HostHeader(`pedidos.$DOMAINNAME`)"
     - "traefik.http.routers.overseerr-rtr.tls=true"
     ## Middlewares
