  # Flood
  flood:
    image: jesec/flood:master-distroless
    container_name: flood
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    security_opt:
      - no-new-privileges:true
    ports:
      - "9013:3001/tcp" # LAN port
    command: --port 3001 --allowedpath /disks
    deploy:
      resources:
        limits:
          memory: 1536M
    environment:
      - HOME=/config
      - PGID=${PGID}
      - PUID=${PUID}
    volumes:
      # Config
      - ${USERDIR}/docker/flood:/config
      - /etc/localtime:/etc/localtime:ro
      # Disks
      - /mnt/:/disks/other/
      - ${USERDIR}/Downloads:/disks/hdd-sata-0/Downloads
      - ${USERDIR}/Media:/disks/hdd-sata-0/Media
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.101
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.flood-rtr.entrypoints=https"
      - "traefik.http.routers.flood-rtr.rule=HostHeader(`flood.$DOMAINNAME`)"
      - "traefik.http.routers.flood-rtr.tls=true"
      ## Middlewares
