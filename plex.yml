    environment:
      - TZ=${TZ}
#      - DEBUG=true # uncomment to enable debug logs
#      - UI_PORT=6247 # uncomment to change the UI port (default 6246). Useful if you're on a network where the port is already in use
#      - API_PORT=3002 # uncomment to change the API port (default 3001). Useful if you're on a network where the port is already in use
    ports:
      - 9019:6246
    restart: unless-stopped
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.118
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.maintainerr-rtr.entrypoints=https"
      - "traefik.http.routers.maintainerr-rtr.rule=Host(`maintainerr.$DOMAINNAME`)"
      - "traefik.http.routers.maintainerr-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.maintainerr-rtr.middlewares=chain-oauth@file"
      ## HTTP Services
      - "traefik.http.routers.maintainerr-rtr.service=maintainerr-svc"
      - "traefik.http.services.maintainerr-svc.loadbalancer.server.port=6246"

  # arr-mcp - servidor MCP (HTTP em /mcp, bearer token) para Sonarr, Radarr,
  # Bazarr, Plex, Seerr e qBittorrent. Os servicos e as chaves de API sao
  # cadastrados pela UI web, nao por env. Escritas vem desligadas por padrao e
  # precisam ser liberadas por servico. So na LAN de proposito: sem labels do
  # traefik, porque o token da acesso de escrita a stack inteira.
  arr-mcp:
    image: ghcr.io/bardesss/arr-mcp:latest
    container_name: arr-mcp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.119
    ports:
      - 9021:6060
    volumes:
      - ${USERDIR}/docker/arr-mcp:/config
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

