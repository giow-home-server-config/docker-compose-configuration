version: "3.7"

services:
  # Plex - Media Server
  plex:
    image: plexinc/pms-docker:plexpass
    container_name: plex
    restart: unless-stopped
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.95
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "$PLEX_PORT:32400/tcp" # Plex Server Port
      # Do NOT forward these ports below through your router
      - "32469:32469/tcp" # access to the Plex DLNA Server
      #- "1900:1900/udp" # access to the Plex DLNA Server
      - "8324:8324/tcp" # controlling Plex for Roku via Plex Companion
      - "32410:32410/udp" # current GDM network discovery
      - "32412:32412/udp" # current GDM network discovery
      - "32413:32413/udp" # current GDM network discovery
      - "32414:32414/udp" # current GDM network discovery
    volumes:
      # Config
      - $USERDIR/docker/plexms:/config
      # Offload transcoding to RAM if you have enough RAM
      - /dev/shm:/transcode
      # - $USERDIR/Media/Transcode/plex_tmp:/transcode
      # Disks
      - /mnt/:/disks/other/
      - ${USERDIR}/Downloads:/disks/hdd-sata-0/Downloads
      - ${USERDIR}/Media:/disks/hdd-sata-0/Media
    environment:
      TZ: $TZ
      HOSTNAME: $PLEX_HOSTNAME
      PLEX_CLAIM: $PLEX_CLAIM
      PLEX_UID: $PUID
      PLEX_GID: $PGID
      ADVERTISE_IP: http://$SERVER_IP:$PLEX_PORT/
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.plex-rtr.entrypoints=https"
      - "traefik.http.routers.plex-rtr.rule=HostHeader(`plex.$DOMAINNAME`)"
      - "traefik.http.routers.plex-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.plex-rtr.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.plex-rtr.service=plex-svc"
      - "traefik.http.services.plex-svc.loadbalancer.server.port=32400"

  # Sonarr - Smart PVR for newsgroup and bittorrent users
  sonarr:
    image: "ghcr.io/linuxserver/sonarr:latest"
    container_name: "sonarr"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9001:8989/tcp" # LAN port
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_MODS=gilbn/theme.park:sonarr
      - TP_THEME=dark
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.91
    volumes:
      # Config
      - ${USERDIR}/docker/sonarrp:/config
      - "/etc/localtime:/etc/localtime:ro"
      # Disks
      - /mnt/:/disks/other/
      - ${USERDIR}/Downloads:/disks/hdd-sata-0/Downloads
      - ${USERDIR}/Media:/disks/hdd-sata-0/Media
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 1024M
    labels:
      - "traefik.enable=true"
      ## HTTP Routers Auth Bypass for NZB360
      - "traefik.http.routers.sonarr-rtr-bypass.entrypoints=https"
      - "traefik.http.routers.sonarr-rtr-bypass.rule=Headers(`X-Api-Key`, `$SONARR_API_KEY`) || Query(`apikey`, `$SONARR_API_KEY`)"
      - "traefik.http.routers.sonarr-rtr-bypass.priority=100"
      - "traefik.http.routers.sonarr-rtr-bypass.tls=true"
      ## HTTP Routers Auth
      - "traefik.http.routers.sonarr-rtr.entrypoints=https"
      - "traefik.http.routers.sonarr-rtr.rule=HostHeader(`sonarr.$DOMAINNAME`)"
      - "traefik.http.routers.sonarr-rtr.tls=true"
      - "traefik.http.routers.sonarr-rtr.priority=99"
      ## Middlewares
      - "traefik.http.routers.sonarr-rtr-bypass.middlewares=chain-no-auth@file"
      - "traefik.http.routers.sonarr-rtr.middlewares=chain-oauth@file"
      ## HTTP Services
      - "traefik.http.routers.sonarr-rtr.service=sonarr-svc"
      - "traefik.http.routers.sonarr-rtr-bypass.service=sonarr-svc"
      - "traefik.http.services.sonarr-svc.loadbalancer.server.port=8989"

  # Radarr - A fork of Sonarr to work with movies à la Couchpotato.
  radarr:
    image: "lscr.io/linuxserver/radarr:latest"
    container_name: "radarr"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9002:7878/tcp" # LAN port
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_MODS=gilbn/theme.park:radarr
      - TP_THEME=plex
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.92
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 1024M
    volumes:
      # Config
      - ${USERDIR}/docker/radarr:/config
      - "/etc/localtime:/etc/localtime:ro"
      # Disks
      - /mnt/:/disks/other/
      - ${USERDIR}/Downloads:/disks/hdd-sata-0/Downloads
      - ${USERDIR}/Media:/disks/hdd-sata-0/Media
    labels:
      - "traefik.enable=true"
      ## HTTP Routers Auth Bypass for NZB360
      - "traefik.http.routers.radarr-rtr-bypass.entrypoints=https"
      - "traefik.http.routers.radarr-rtr-bypass.rule=Headers(`X-Api-Key`, `$RADARR_API_KEY`) || Query(`apikey`, `$RADARR_API_KEY`)"
      - "traefik.http.routers.radarr-rtr-bypass.priority=100"
      - "traefik.http.routers.radarr-rtr-bypass.tls=true"
      ## HTTP Routers Auth
      - "traefik.http.routers.radarr-rtr.entrypoints=https"
      - "traefik.http.routers.radarr-rtr.rule=HostHeader(`radarr.$DOMAINNAME`)"
      - "traefik.http.routers.radarr-rtr.tls=true"
      - "traefik.http.routers.radarr-rtr.priority=99"
      ## Middlewares
      - "traefik.http.routers.radarr-rtr-bypass.middlewares=chain-no-auth@file"
      - "traefik.http.routers.radarr-rtr.middlewares=chain-oauth@file"
      ## HTTP Services
      - "traefik.http.routers.radarr-rtr.service=radarr-svc"
      - "traefik.http.services.radarr-svc.loadbalancer.server.port=7878"

  # Jackett - API Support for your favorite torrent trackers
  jackett:
    image: "lscr.io/linuxserver/jackett:latest"
    container_name: "jackett"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9003:9117/tcp" # LAN port
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - AUTO_UPDATE=true
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.89
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 1024M
    volumes:
      # Config
      - ${USERDIR}/docker/jackett:/config
      - "/etc/localtime:/etc/localtime:ro"
      # Disks
      - /mnt/:/disks/other/
      - ${USERDIR}/Downloads:/disks/hdd-sata-0/Downloads
      - ${USERDIR}/Media:/disks/hdd-sata-0/Media
    labels:
      - "traefik.enable=true"
      ## HTTP Routers Auth Bypass for NZB360
      - "traefik.http.routers.jackett-rtr-bypass.entrypoints=https"
      - "traefik.http.routers.jackett-rtr-bypass.rule=Headers(`X-Api-Key`, `$JACKETT_API_KEY`) || Query(`apikey`, `$JACKETT_API_KEY`)"
      - "traefik.http.routers.jackett-rtr-bypass.priority=100"
      - "traefik.http.routers.jackett-rtr-bypass.tls=true"
      ## HTTP Routers
      - "traefik.http.routers.jackett-rtr.entrypoints=https"
      - "traefik.http.routers.jackett-rtr.rule=HostHeader(`jackett.$DOMAINNAME`)"
      - "traefik.http.routers.jackett-rtr.priority=99"
      - "traefik.http.routers.jackett-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.jackett-rtr-bypass.middlewares=chain-no-auth@file"
      - "traefik.http.routers.jackett-rtr.middlewares=chain-oauth@file"
      ## HTTP Services
      - "traefik.http.routers.jackett-rtr.service=jackett-svc"
      - "traefik.http.routers.jackett-rtr-bypass.service=jackett-svc"
      - "traefik.http.services.jackett-svc.loadbalancer.server.port=9117"

  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr:latest
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.93
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 1024M
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
    ports:
      - "${PORT:-8191}:8191"
    restart: unless-stopped

  qbittorrent:
    container_name: qbittorrent
    image: binhex/arch-qbittorrentvpn:latest
    restart: unless-stopped
    logging:
      driver: json-file
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.104
    ports:
      - 9012:8080/tcp
      # - 8119:8118/tcp # Privoxy
    privileged: true
    deploy:
      resources:
        limits:
          memory: 3000M
    cap_add:
      - SYS_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - TZ=${TZ}
      - UMASK=022
      - DEBUG=false
      - VPN_ENABLED=${VPN_ENABLED}
      - VPN_CLIENT=${VPN_CLIENT}
      - VPN_USER=${VPN_USER}
      - VPN_PASS=${VPN_PASS}
      - VPN_PROV=${VPN_PROVIDER}
      - STRICT_PORT_FORWARD=yes
      # This is needed if the server running the torrent client is outside your network
      - ENABLE_PRIVOXY=no
      - LAN_NETWORK=192.168.1.0/24
      - NAME_SERVERS=84.200.69.80,37.235.1.174,1.1.1.1,37.235.1.177,84.200.70.40,1.0.0.1
      - WEBUI_PORT=8080
    volumes:
      # Config
      - /etc/localtime:/etc/localtime:ro
      - ${USERDIR}/docker/qbittorrent:/config:rw
      # Disks
      - /mnt/:/disks/other/
      - ${USERDIR}/Downloads:/disks/hdd-sata-0/Downloads
      - ${USERDIR}/Media:/disks/hdd-sata-0/Media
    labels:
      - "traefik.enable=true"
      ## HTTP Routers Auth Bypass for NZB360
      - "traefik.http.routers.qbit-rtr-bypass.entrypoints=https"
      - "traefik.http.routers.qbit-rtr-bypass.rule=Headers(`HEADER_BYPASS`, `$HEADER_BYPASS`)"
      - "traefik.http.routers.qbit-rtr-bypass.priority=100"
      - "traefik.http.routers.qbit-rtr-bypass.tls=true"
      ## HTTP Routers
      - "traefik.http.routers.qbit-rtr.entrypoints=https"
      - "traefik.http.routers.qbit-rtr.rule=HostHeader(`torrent.$DOMAINNAME`)"
      - "traefik.http.routers.qbit-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.qbit-rtr.middlewares=chain-oauth@file"
      ## Middlewares - Bypass
      - "traefik.http.routers.qbit-rtr-bypass.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.qbit-rtr.service=qbit-svc"
      - "traefik.http.routers.sonarr-rtr-bypass.service=qbit-svc"
      - "traefik.http.services.qbit-svc.loadbalancer.server.port=8080"

