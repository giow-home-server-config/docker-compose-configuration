  qbittorrent:
    container_name: qbittorrent
    image: binhex/arch-qbittorrentvpn:latest
    restart: unless-stopped
    logging:
      driver: json-file
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.104
    ports:
      - 9012:8080/tcp
      # - 8119:8118/tcp # Privoxy
    privileged: true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3000M
    cap_add:
      - SYS_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - TZ=${TZ}
      - UMASK=022
      - DEBUG=false
      - VPN_ENABLED=${VPN_ENABLED}
      - VPN_CLIENT=${VPN_CLIENT}
      - VPN_USER=${VPN_USER}
      - VPN_PASS=${VPN_PASS}
      - VPN_PROV=${VPN_PROVIDER}
      - STRICT_PORT_FORWARD=yes
      # This is needed if the server running the torrent client is outside your network
      - ENABLE_PRIVOXY=no
      - LAN_NETWORK=192.168.1.0/24
      - NAME_SERVERS=84.200.69.80,37.235.1.174,1.1.1.1,37.235.1.177,84.200.70.40,1.0.0.1
      - WEBUI_PORT=8080
    volumes:
      # Config
      - /etc/localtime:/etc/localtime:ro
      - ${USERDIR}/docker/qbittorrent:/config:rw
      # Disks
      - /mnt/:/disks/other/
      - ${USERDIR}/Downloads:/disks/hdd-sata-0/Downloads
      - ${USERDIR}/Media:/disks/hdd-sata-0/Media
    labels:
      - "traefik.enable=true"
      ## HTTP Routers Auth Bypass for NZB360
      - "traefik.http.routers.qbittorrent-rtr-bypass.entrypoints=https"
      - "traefik.http.routers.qbittorrent-rtr-bypass.rule=Host(`torrent.$DOMAINNAME`) && Header(`Nzb360-Header`, `$NZB360_HEADER`)"
      - "traefik.http.routers.qbittorrent-rtr-bypass.priority=100"
      - "traefik.http.routers.qbittorrent-rtr-bypass.tls=true"
      ## HTTP Routers
      - "traefik.http.routers.qbittorrent-rtr.entrypoints=https"
      - "traefik.http.routers.qbittorrent-rtr.rule=Host(`torrent.$DOMAINNAME`)"
      - "traefik.http.routers.qbittorrent-rtr.tls=true"
      - "traefik.http.routers.qbittorrent-rtr.priority=99"
      ## Middlewares
      - "traefik.http.routers.qbittorrent-rtr.middlewares=chain-oauth@file"
      ## Middlewares - Bypass
      - "traefik.http.routers.qbittorrent-rtr-bypass.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.qbittorrent-rtr.service=qbittorrent-svc"
      - "traefik.http.routers.qbittorrent-rtr-bypass.service=qbittorrent-svc"
      - "traefik.http.services.qbittorrent-svc.loadbalancer.server.port=8080"


  # Seerr - media requests. Successor to Overseerr, which upstream deprecated
  # in February 2026 when the Overseerr and Jellyseerr teams merged into one
  # project. Seerr migrates the existing database automatically on first start.
  #
  # Config moved from /config (the linuxserver.io layout) to /app/config, but
  # the host directory is unchanged so the migration finds the old data. PUID
  # and PGID are gone because Seerr runs as the non-root `node` user at UID
  # 1000, which already owns that directory here.
  #
  # The custom logo mounts were dropped: they pointed at /app/overseerr/public,
  # which does not exist in Seerr, and a bind mount to a missing path silently
  # creates a directory instead of failing.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    # Required by Seerr.
    init: true
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.96
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${USERDIR}/docker/overseerr:/app/config
      # Custom branding, restored after the Seerr migration. The paths moved:
      # Overseerr served these from /app/overseerr/public, Seerr serves them from
      # /app/public. All three targets were confirmed to exist in the image
      # first - a bind mount onto a path the image does not have creates an
      # empty file instead of failing, which is why they were dropped rather
      # than guessed at during the migration.
      - ${USERDIR}/docker/overseerr/logo-branca.svg:/app/public/logo_stacked.svg:ro
      - ${USERDIR}/docker/overseerr/logo-branca.svg:/app/public/logo_full.svg:ro
      - ${USERDIR}/docker/overseerr/logo-branca.png:/app/public/logo_full.png:ro
    environment:
      - TZ=$TZ
      - LOG_LEVEL=info
    ports:
      - 9020:5055
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.seerr-rtr.entrypoints=https"
      # Host() rather than HostHeader(): valid in both Traefik v2 and v3.
      - "traefik.http.routers.seerr-rtr.rule=Host(`pedidos.$DOMAINNAME`)"
      - "traefik.http.routers.seerr-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.seerr-rtr.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.seerr-rtr.service=seerr-svc"
      - "traefik.http.services.seerr-svc.loadbalancer.server.port=5055"

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.103
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/docker/tautulli:/config
    restart: unless-stopped
    ports:
      - 9011:8181
    labels:
      - "traefik.enable=true"
      ## HTTP Routers Auth Bypass for NZB360
      - "traefik.http.routers.tautulli-rtr-bypass.entrypoints=https"
      - "traefik.http.routers.tautulli-rtr-bypass.rule=Host(`tautulli.$DOMAINNAME`) && Header(`Nzb360-Header`, `$NZB360_HEADER`)"
      - "traefik.http.routers.tautulli-rtr-bypass.priority=100"
      - "traefik.http.routers.tautulli-rtr-bypass.tls=true"
      ## HTTP Routers
      - "traefik.http.routers.tautulli-rtr.entrypoints=https"
      - "traefik.http.routers.tautulli-rtr.rule=Host(`tautulli.$DOMAINNAME`)"
      - "traefik.http.routers.tautulli-rtr.tls=true"
      - "traefik.http.routers.tautulli-rtr.priority=99"
      ## Middlewares
      - "traefik.http.routers.tautulli-rtr.middlewares=chain-oauth@file"
      ## Middlewares - Bypass
      - "traefik.http.routers.tautulli-rtr-bypass.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.tautulli-rtr.service=tautulli-svc"
      - "traefik.http.routers.tautulli-rtr-bypass.service=tautulli-svc"
      - "traefik.http.services.tautulli-svc.loadbalancer.server.port=8181"

  unpackerr:
    container_name: unpackerr
    image: ghcr.io/hotio/unpackerr
    restart: unless-stopped
